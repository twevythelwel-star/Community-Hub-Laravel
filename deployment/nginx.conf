# ==============================================================================
# COMMUNITY HUB - PRODUCTION NGINX REVERSE PROXY & TLS TERMINATION CONFIGURATION
# ==============================================================================

# Rate limiting zones to prevent DDoS and brute-force attacks
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_webhook_limit:10m rate=60r/m;

# ── HTTP -> HTTPS Permanent Redirect (Port 80 to 443) ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hub.cypressbay.org;

    # ACME Challenge endpoint for Let's Encrypt / Certbot renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Production Server (Port 443) ───────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.cypressbay.org;

    root /var/www/html/public;
    index index.php;

    # ── TLS Certificates & Modern Cryptographic Ciphers ──────────────────────
    ssl_certificate /etc/letsencrypt/live/hub.cypressbay.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.cypressbay.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hub.cypressbay.org/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── HTTP Security Headers ────────────────────────────────────────────────
    # Enforce HSTS (Strict-Transport-Security) for 1 year including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Client body limit (permits receipt and campaign image uploads)
    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/community_hub_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/community_hub_error.log warn;

    # ── Static Asset Caching (Vite build outputs, fonts, images) ──────────────
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Healthcheck & Liveness Endpoint ──────────────────────────────────────
    location = /up {
        access_log off;
        proxy_pass http://127.0.0.1:8080/up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Stripe & Payment Webhook Ingress (Burst protection) ───────────────────
    location /api/webhooks/ {
        limit_req zone=api_webhook_limit burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Authentication Protection (Rate limit logins) ────────────────────────
    location = /login {
        limit_req zone=login_limit burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Application Gateway ──────────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── FastCGI PHP Handler (or Reverse Proxy to Octane/Container) ───────────
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
