# ==============================================================================
# COMMUNITY HUB - PRODUCTION LOGROTATE CONFIGURATION
# Install in: /etc/logrotate.d/community_hub
# ==============================================================================

# Application general logs (rotated daily, kept for 30 days)
/var/www/html/storage/logs/laravel*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
    sharedscripts
    postrotate
        # Signal queue workers and web application to release open file handles
        su -s /bin/bash www-data -c "cd /var/www/html && php artisan queue:restart" > /dev/null 2>&1 || true
    endscript
}

# Security audit logs (refused visitor scans, pass revocation, authentication failures)
# Retained for 90 days to meet compliance and forensic audit mandates
/var/www/html/storage/logs/security*.log {
    daily
    missingok
    rotate 90
    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
}

# Nginx web server access & error logs
/var/log/nginx/community_hub_*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}
