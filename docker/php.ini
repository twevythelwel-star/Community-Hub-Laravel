; Production overrides on top of php.ini-production.

expose_php = Off
memory_limit = 256M

; Avatar uploads and ID photos.
upload_max_filesize = 10M
post_max_size = 12M

; Code only changes when a new image is deployed, so never re-check files.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
